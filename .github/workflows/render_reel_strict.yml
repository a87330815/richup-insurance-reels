name: 엄격 검수 릴스 렌더
on:
  workflow_dispatch:
    inputs:
      stem:
        required: true
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: |
          pip install -q Pillow numpy requests edge-tts elevenlabs
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: 사진 수집
        run: python -u photos.py "out/scripts/${{ inputs.stem }}.json"
      - name: 필수 검수
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python -u validate_reel_requirements.py "out/scripts/${{ inputs.stem }}.json" "out/photos/${{ inputs.stem }}"
      - name: 카드 생성
        run: python -u cardnews.py "out/scripts/${{ inputs.stem }}.json" -o "out/cards_${{ inputs.stem }}" -p "out/photos/${{ inputs.stem }}" --reels
      - name: 릴스 합성
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python -u render_reels.py "out/scripts/${{ inputs.stem }}.json" --cards "out/cards_${{ inputs.stem }}" --preset 이슈남 --require-tts
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.stem }}
          path: out/reels/*.mp4
