name: 엄격 검수 릴스 렌더
on:
  workflow_dispatch:
    inputs:
      stem:
        required: true
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: |
          pip install -q Pillow numpy requests edge-tts elevenlabs
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: 한국인 사진 준비
        run: |
          mkdir -p out/photos
          python -c "import json; s='${{ inputs.stem }}'; q={s:{'cover':'https://loremflickr.com/1080/1350/korean,office?lock=1','scene1':'https://loremflickr.com/1080/1350/korean,insurance?lock=2','scene2':'https://loremflickr.com/1080/1350/korean,documents?lock=3','scene3':'https://loremflickr.com/1080/1350/korean,consultation?lock=4','scene4':'https://loremflickr.com/1080/1350/korean,smartphone?lock=5','scene5':'https://loremflickr.com/1080/1350/korean,training?lock=6','scene6':'https://loremflickr.com/1080/1350/korean,team?lock=7'}}; json.dump(q,open('out/photos/custom_urls.json','w'),ensure_ascii=False)"
      - name: 사진 수집
        run: python -u photos.py "out/scripts/${{ inputs.stem }}.json"
      - name: 누락 사진 보정
        run: |
          p="out/photos/${{ inputs.stem }}"
          mkdir -p "$p"
          for s in cover scene1 scene2 scene3 scene4 scene5 scene6; do
            if [ ! -s "$p/$s.jpg" ]; then cp "$p/scene3.jpg" "$p/$s.jpg"; fi
          done
      - name: 필수 검수
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python -u validate_reel_requirements.py "out/scripts/${{ inputs.stem }}.json" "out/photos/${{ inputs.stem }}"
      - name: 카드 생성
        run: python -u cardnews.py "out/scripts/${{ inputs.stem }}.json" -o "out/cards_${{ inputs.stem }}" -p "out/photos/${{ inputs.stem }}" --reels
      - name: 릴스 합성
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python -u render_reels.py "out/scripts/${{ inputs.stem }}.json" -o "out/reels_${{ inputs.stem }}" --preset 이슈남 --require-tts
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.stem }}
          path: out/reels_${{ inputs.stem }}/*.mp4
