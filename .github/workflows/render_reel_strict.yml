name: 보험 사진 수집 검수 렌더
on:
  workflow_dispatch:
    inputs:
      stem:
        required: true
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: |
          pip install -q Pillow numpy requests edge-tts elevenlabs
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: 대본 경로 정규화
        run: |
          mkdir -p out/scripts
          cp "out/scripts/${{ inputs.stem }}.json" out/scripts/insurance_test.json
          echo "STEM=insurance_test" >> "$GITHUB_ENV"
      - name: 사진 수집
        run: python -u photos.py "out/scripts/$STEM.json"
      - name: 사진 6장 필수 검수
        run: |
          python - <<'PY'
          import json,sys,os
          p="out/photos/insurance_test/photos.json"
          if not os.path.isfile(p): sys.exit(1)
          m=json.load(open(p,encoding="utf-8"))
          got=len(m.get("photos",{})); print(f"사진 수집 결과: {got}/7장")
          req=["cover","scene1","scene2","scene3","scene4","scene5","scene6"]
          miss=[x for x in req if x not in m.get("photos",{})]
          if miss: print("누락:", ",".join(miss)); sys.exit(1)
          PY
      - name: 필수 검수
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python -u validate_reel_requirements.py "out/scripts/$STEM.json" "out/photos/$STEM"
      - name: 카드 생성
        run: python -u cardnews.py "out/scripts/$STEM.json" -o "out/cards_$STEM" -p "out/photos/$STEM" --reels
      - name: 릴스 합성
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python -u render_reels.py "out/scripts/$STEM.json" -o "out/reels_$STEM.mp4" --preset 이슈남 --require-tts
      - uses: actions/upload-artifact@v4
        with:
          name: reel-insurance-test
          path: out/reels_$STEM.mp4
