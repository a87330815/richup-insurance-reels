name: 보험 전문가 카드뉴스 검수 제작
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "카드뉴스 주제"
        required: false
        default: "보험 판매수수료 1200%룰과 환수 리스크"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: |
          pip install -q Pillow numpy requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: 보험 전문뉴스 수집
        run: |
          python -u news_collect.py --max 10
          python - <<'PY'
          import json,sys
          d=json.load(open("out/news.json",encoding="utf-8"))
          items=d.get("items",[])
          keys=("보험","GA","설계사","수수료","1200","환수","불완전","보험사기","제재","기준금리","한국은행","환율","원달러","전쟁","지정학","트럼프","공화당","증시","주식")
          hit=[x for x in items if any(k in (x.get("title","")+" "+x.get("description","")) for k in keys)]
          print(f"보험 전문뉴스: {len(hit)}건 / 전체 {len(items)}건")
          if not hit: sys.exit("보험 전문뉴스가 없습니다")
          PY
      - name: 전문가용 카드뉴스 대본 생성
        run: |
          mkdir -p out/scripts
          python - <<'PY'
          import json
          d=json.load(open("out/news.json",encoding="utf-8"))
          items=d.get("items",[])
          keys=("1200","수수료","환수","불완전","보험사기","제재")
          item=next((x for x in items if any(k in (x.get("title","")+" "+x.get("description","")) for k in keys)),items[0])
          title=item.get("title","보험 판매수수료 제도 변경")
          src=item.get("link","")
          scenes=[
            {"subtitle":"받은 수수료가 다시 청구될 수 있습니다","body":"1200% 상한만 보면 놓칩니다. <y>선지급액·유지율·환수 조건</y>이 맞물리면 이미 받은 수수료가 다음 달 채무로 바뀝니다.","photo_query":"insurance contract documents calculator hands"},
            {"subtitle":"환수 통지서가 오면 책임선부터 봅니다","body":"보험사·GA·지사 중 <y>누가 지급하고 누가 환수하는지</y> 계약서와 수수료 테이블을 대조해야 합니다. 책임 주체가 다르면 분쟁이 길어집니다.","photo_query":"business meeting insurance paperwork hands laptop"},
            {"subtitle":"13회차 유지율이 현금흐름을 가릅니다","body":"초기 실적보다 <y>13회차·25회차 유지율</y>이 중요합니다. 해지율이 오르면 환수와 다음 달 지급액이 동시에 흔들립니다.","photo_query":"financial calculator commission paperwork desk"},
            {"subtitle":"고수수료보다 무서운 건 설명 공백입니다","body":"문제는 수수료율 자체가 아니라 <y>적합성·비교설명·상담 근거</y>가 비어 있는지입니다. 기록이 없으면 방어자료도 없습니다.","photo_query":"compliance checklist insurance documents pen"},
            {"subtitle":"오늘 계약서에서 세 줄만 확인하십시오","body":"① 지급일·환수 기준 ② 회차별 유지율 ③ 상담기록 보관. 기사보다 <y>위촉계약서와 수수료 테이블</y>이 먼저입니다.","photo_query":"office filing insurance records hands"}
          ]
          out={"title":"보험 수수료, 지급액보다 환수 구조가 먼저입니다","meta":{"category":"보험 실무","attribution":title},"cover":{"photo_query":"insurance warning notice documents hands red pen","lines":["<y>이번 달 수수료</y>","환수될 수 있습니다"]},"source":{"title":title,"url":src},"scenes":scenes}
          json.dump(out,open("out/scripts/insurance_preview.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY
      - name: 사진 수집
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python -u photos.py out/scripts/insurance_preview.json
      - name: 사진 필수 검수
        run: |
          python - <<'PY'
          import json,sys,os
          m=json.load(open("out/photos/insurance_preview/photos.json",encoding="utf-8"))
          req=["cover"]+[f"scene{i}" for i in range(1,6)]
          miss=[x for x in req if x not in m.get("photos",{}) or not os.path.isfile("out/photos/insurance_preview/"+m["photos"][x])]
          print(f"사진 수집 결과: {len(req)-len(miss)}/{len(req)}")
          if miss: sys.exit("사진 누락: "+",".join(miss))
          import hashlib
          hashes={}
          dup=[]
          for slot,fname in m.get("photos",{}).items():
              p="out/photos/insurance_preview/"+fname
              if os.path.isfile(p):
                  h=hashlib.sha256(open(p,"rb").read()).hexdigest()
                  if h in hashes: dup.append(f"{slot}={hashes[h]}")
                  else: hashes[h]=slot
          print(f"사진 고유 파일: {len(hashes)}/{len(req)}")
          if dup: sys.exit("사진 중복: "+",".join(dup))
          PY
      - name: 카드뉴스 생성
        run: python -u cardnews.py out/scripts/insurance_preview.json -o out/cards_insurance_preview -p out/photos/insurance_preview --layout magazine
      - name: 게시 없이 카드뉴스 업로드
        uses: actions/upload-artifact@v4
        with:
          name: insurance-cardnews-no-publish
          path: |
            out/cards_insurance_preview/*.png
            out/news.json
            out/scripts/insurance_preview.json
            out/photos/insurance_preview/photos.json
          retention-days: 14
