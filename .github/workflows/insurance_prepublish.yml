name: 보험 게시 전 검수 제작
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "테스트 주제"
        required: false
        default: "보험 판매수수료 1200%룰"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: |
          pip install -q Pillow numpy requests elevenlabs edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: 보험 전문뉴스 수집
        run: |
          python -u news_collect.py --max 10
          python - <<'PY'
          import json,sys
          d=json.load(open("out/news.json",encoding="utf-8"))
          items=d.get("items",[])
          keys=("보험","GA","설계사","수수료","1200","불완전","보험사기")
          matched=[x for x in items if any(k in (x.get("title","")+" "+x.get("description","")) for k in keys)]
          print(f"보험 관련 뉴스: {len(matched)}건 / 전체 {len(items)}건")
          if not matched: sys.exit("보험 관련 전문뉴스가 없습니다")
          PY
      - name: 대본 생성
        run: |
          mkdir -p out/scripts
          python - <<'PY'
          import json,os
          d=json.load(open("out/news.json",encoding="utf-8"))
          items=d.get("items",[])
          keys=("보험","GA","설계사","수수료","1200","불완전","보험사기")
          priority=("1200","수수료","환수","불완전","보험사기","제재")
          item=next((x for x in items if any(k in (x.get("title","")+" "+x.get("description","")) for k in priority)),None) or next((x for x in items if any(k in (x.get("title","")+" "+x.get("description","")) for k in keys)),items[0])
          src=item.get("link","")
          title=item.get("title","보험 판매수수료 제도 변경")
          scenes=[
            ("이걸 모르고 영업하면 수수료가 날아갑니다","이걸 모르고 영업하면 이번 달 수수료가 날아갑니다. 보험 설계사님, 보험 판매수수료 제도가 바뀌고 있지예.","한국인 insurance agent worried office"),
            ("1200%룰, GA 설계사도 적용","이제 GA 소속 설계사도 초년도 모집수수료 기준을 반드시 확인해야 합니다. 예전처럼 지급된다고 생각하면 안 됩니다.","한국인 insurance agent contract consultation"),
            ("선지급만 믿으면 위험합니다","처음 받은 돈만 보면 안 됩니다. 계약이 조기 해지되거나 유지 조건을 못 채우면 환수 문제가 생길 수 있지예.","한국인 insurance agent calculator money"),
            ("설명 잘못하면 법적 책임","수수료가 높은 상품만 권하거나 비교설명을 빠뜨리면 민원에서 끝나지 않을 수 있습니다. 설명 근거를 남겨야 합니다.","한국인 insurance agent office"),
            ("이번 상담부터 이렇게 하이소","상품을 권하기 전에 수수료 등급과 고객에게 맞는 이유를 함께 설명하고, 비교설명 확인서를 남기이소.","한국인 insurance agent customer meeting"),
            ("게시 전 팩트부터 확인","기사 제목만 믿지 말고 금융위·금감원 원문까지 확인하이소. 보험 설계사에게 직접 돈 되는 법률 이슈만 전해드리겠습니다.","한국인 insurance agent training")
          ]
          out={"title":"보험 설계사 수수료, 이번 달부터 달라집니다","source":{"title":title,"url":src},"scenes":[{"subtitle":a,"narration":b,"photo_query":c} for a,b,c in scenes]}
          json.dump(out,open("out/scripts/insurance_preview.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print("대본 생성 완료:",title)
          PY
      - name: 사진 수집
        run: python -u photos.py out/scripts/insurance_preview.json
      - name: 사진 필수 검수
        run: |
          python - <<'PY'
          import json,sys
          p="out/photos/insurance_preview/photos.json"
          m=json.load(open(p,encoding="utf-8"))
          req=["cover"]+[f"scene{i}" for i in range(1,7)]
          got=m.get("photos",{})
          print(f"사진 수집 결과: {len(got)}/{len(req)}")
          miss=[x for x in req if x not in got]
          if miss: sys.exit("사진 누락: "+",".join(miss))
          PY
      - name: 콘텐츠 검수
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python -u validate_reel_requirements.py out/scripts/insurance_preview.json out/photos/insurance_preview
      - name: 카드뉴스 생성
        run: python -u cardnews.py out/scripts/insurance_preview.json -o out/cards_insurance_preview -p out/photos/insurance_preview --reels
      - name: 릴스 합성 (ElevenLabs Voice ID)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python -u render_reels.py out/scripts/insurance_preview.json -o out/insurance_preview.mp4 --preset 이슈남 --require-tts
      - name: 게시 없이 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: insurance-preview-no-publish
          path: |
            out/insurance_preview.mp4
            out/cards_insurance_preview/*.png
            out/news.json
            out/scripts/insurance_preview.json
            out/photos/insurance_preview/photos.json
          retention-days: 14
